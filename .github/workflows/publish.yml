name: Build and Publish Core Images

on:
  push:
    branches:
      - main
    paths:
      - 'debian-source/**'
      - 'debian-java/**'
      - 'python-bot/**'
      - '.github/workflows/publish.yml'
  # Добавлено: автоматический запуск каждый понедельник в 04:00 утра (по UTC)
  schedule:
    - cron: '0 4 * * 1'
  # Добавлено: кнопка ручного запуска прямо из интерфейса GitHub
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_PREFIX: sgc-novus/core-images

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - context: ./debian-source
            tag: source
          - context: ./debian-java
            tag: java
          - context: ./python-bot
            tag: python

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6 # Обновлено до v6 для устранения предупреждений
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6 # Обновлено до v6 для устранения предупреждений
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}:${{ matrix.tag }}
          labels: ${{ steps.meta.outputs.labels }}

  update-hub-data:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run AI Runtimes Compiler
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          npm install
          node scripts/compile_runtimes.js

      - name: Commit and push metadata
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add runtimes.json scripts/translation_cache.json
          git commit -m "docs: auto-update runtimes metadata [skip ci]" || echo "No changes to commit"
          git push